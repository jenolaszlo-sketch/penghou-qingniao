name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build Penghou.Qingniao.slnx --configuration Release

      - name: Verify formatting
        run: dotnet format Penghou.Qingniao.slnx --verify-no-changes --no-restore

      - name: Test and coverage (abstractions)
        run: >
          dotnet test tests/Penghou.Qingniao.Tests/Penghou.Qingniao.Tests.csproj
          --configuration Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-abstractions/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Qingniao.Abstractions]*'
          /p:Threshold=70
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (runtime)
        run: >
          dotnet test tests/Penghou.Qingniao.Tests/Penghou.Qingniao.Tests.csproj
          --configuration Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-runtime/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Qingniao]*%2c-[Penghou.Qingniao.Abstractions]*'
          /p:Threshold=65
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (codex)
        run: >
          dotnet test tests/Penghou.Qingniao.Codex.Tests/Penghou.Qingniao.Codex.Tests.csproj
          --configuration Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-codex/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Qingniao.Codex]*'
          /p:Threshold=70
          /p:ThresholdType=line%2cbranch

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: |
            coverage-abstractions/
            coverage-runtime/
            coverage-codex/

      - name: Pack
        run: dotnet pack Penghou.Qingniao.slnx --configuration Release --no-build --output artifacts --property:PackageVersion=0.0.0-ci.${{ github.run_id }}

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
